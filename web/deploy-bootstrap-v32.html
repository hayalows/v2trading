<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090c10">
<meta name="description" content="V2 market research workspace for EURUSD and GBPUSD market state, paper trades, model evidence and data quality.">
<title>V2</title>
<style>html,body{margin:0;background:#090c10;color:#f5f7fa;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot{min-height:100dvh;display:grid;place-items:center;padding:24px}.boot span{opacity:.68;font-size:14px}</style>
</head>
<body>
<div class="boot"><span>Loading V2…</span></div>
<script>
(async()=>{
  const commit='4af339443848bda40e743fc39f055970218f1555';
  const base=`https://cdn.jsdelivr.net/gh/hayalows/v2trading@${commit}/web/`;
  try{
    let html=await fetch(base+'index.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('asset '+r.status);return r.text()});
    html=html.replaceAll('href="/web/','href="'+base).replaceAll('src="/web/','src="'+base);
    html=html.replace('</head>',`<link rel="stylesheet" href="${base}v32-ui.css"><link rel="stylesheet" href="${base}v33-ui.css"></head>`);
    html=html.replace('</body>',`<script src="${base}v32-ui.js"><\/script><script src="${base}v33-ui.js"><\/script></body>`);
    document.open();document.write(html);document.close();
  }catch(e){
    console.error(e);document.body.innerHTML='<div class="boot"><span>V2 could not load. Refresh to retry.</span></div>';
  }
})();
</script>
</body>
</html>
