<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090c10">
<meta name="description" content="V2 market research workspace for EURUSD and GBPUSD market state, paper trades, model evidence and data quality.">
<title>V2</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preload" href="https://cdn.jsdelivr.net/fontsource/fonts/inter:vf@5.3.0/latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'V2 Inter';font-style:normal;font-display:block;font-weight:100 900;src:url('https://cdn.jsdelivr.net/fontsource/fonts/inter:vf@5.3.0/latin-wght-normal.woff2') format('woff2-variations')}
html,body{margin:0;background:#090c10;color:#f5f7fa;font-family:'V2 Inter',Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot{min-height:100dvh;display:grid;place-items:center;padding:24px}.boot span{opacity:.68;font-size:14px}
</style>
</head>
<body>
<div class="boot"><span>Loading V2…</span></div>
<script>
(async()=>{
  const commit='47ed4a820afd0c6d41bf4cec37a52d376dc5bce3';
  const base=`https://cdn.jsdelivr.net/gh/hayalows/v2trading@${commit}/web/`;
  const interFont='https://cdn.jsdelivr.net/fontsource/fonts/inter:vf@5.3.0/latin-wght-normal.woff2';
  try{
    let html=await fetch(base+'index.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('asset '+r.status);return r.text()});
    html=html.replaceAll('href="/web/','href="'+base).replaceAll('src="/web/','src="'+base);
    html=html.replace('</head>',`<link id="v32UiCss" rel="stylesheet" href="${base}v32-ui.css"><link id="v33UiCss" rel="stylesheet" href="${base}v33-ui.css"><link rel="preload" href="${interFont}" as="font" type="font/woff2" crossorigin><style id="v2InterLock">@font-face{font-family:'V2 Inter';font-style:normal;font-display:block;font-weight:100 900;src:url('${interFont}') format('woff2-variations')}html,body,button,input,textarea,select,summary{font-family:'V2 Inter',Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;font-synthesis:none}body{font-optical-sizing:auto}.material-symbols-rounded{font-family:'Material Symbols Rounded'!important}</style><script id="v32UiJs" defer src="${base}v32-ui.js"><\/script><script id="v33UiJs" defer src="${base}v33-ui.js"><\/script></head>`);
    document.open();document.write(html);document.close();
  }catch(e){
    console.error(e);document.body.innerHTML='<div class="boot"><span>V2 could not load. Refresh to retry.</span></div>';
  }
})();
</script>
</body>
</html>
