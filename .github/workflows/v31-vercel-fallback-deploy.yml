name: v31-vercel-fallback-deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v31-vercel-fallback-deploy.yml'

permissions:
  contents: read

concurrency:
  group: v31-vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_20IpnOKLjxGtiLRZCQXiCeBC
      VERCEL_PROJECT_ID: prj_jHB7ah1WN3AtDj5JaTj4j9vQAePT
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify deploy credential is available
        shell: bash
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo 'VERCEL_TOKEN is not configured in GitHub Actions secrets.' >&2
            exit 2
          fi

      - name: Link exact V2 Vercel project
        shell: bash
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull production settings
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production bundle
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production bundle
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
