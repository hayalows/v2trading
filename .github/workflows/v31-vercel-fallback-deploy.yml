name: v33-vercel-production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/deploy-bootstrap-v32.html'
      - 'web/v33-ui.css'
      - 'web/v33-ui.js'
      - '.github/workflows/v31-vercel-fallback-deploy.yml'

permissions:
  contents: read

concurrency:
  group: v33-vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_20IpnOKLjxGtiLRZCQXiCeBC
      VERCEL_PROJECT_ID: prj_jHB7ah1WN3AtDj5JaTj4j9vQAePT
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Detect deploy credential
        id: auth
        shell: bash
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'VERCEL_TOKEN is not configured; deployment is skipped without failing CI.'
          fi

      - name: Prepare immutable V3.3 static bundle
        if: steps.auth.outputs.available == 'true'
        shell: bash
        run: |
          rm -rf .v33-deploy
          mkdir -p .v33-deploy/.vercel
          cp web/deploy-bootstrap-v32.html .v33-deploy/index.html
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .v33-deploy/.vercel/project.json

      - name: Deploy V3.3 to production
        if: steps.auth.outputs.available == 'true'
        shell: bash
        run: |
          cd .v33-deploy
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
