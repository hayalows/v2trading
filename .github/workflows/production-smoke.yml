name: production-smoke

# Verifies the live Vercel + CDN path at a 390x844 mobile viewport, including compact account access, pair-filtered journal, optional advanced details and recent FX ranges.
# Production app pin verified in this run: 0b39330de81912624df12d1eb60bddef9863e15c
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-smoke.yml'
  workflow_dispatch:

jobs:
  live-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Click through live production mobile UI
        env:
          SMOKE_URL: https://v2trading.vercel.app
        run: node scripts/browser_smoke.mjs