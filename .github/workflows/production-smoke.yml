name: production-smoke

# Verifies the live Vercel + CDN path at a 390x844 mobile viewport, including compact account access, pair-filtered journal, optional advanced details, recent FX ranges and non-overlapping Ask V2 quick actions.
# Production app pin verified in this run: ac6b05f4c750f026a2a87e6387108d2890d5d1db
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-smoke.yml'
  workflow_dispatch:

jobs:
  live-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Click through live production mobile UI
        env:
          SMOKE_URL: https://v2trading.vercel.app
        run: node scripts/browser_smoke.mjs