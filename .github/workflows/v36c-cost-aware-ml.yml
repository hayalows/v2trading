name: v36c-cost-aware-ml

on:
  push:
    branches: [main]
    paths:
      - 'scripts/v36c_ml_one.py'
      - 'scripts/v36c_aggregate_holdout.py'
      - 'reports/v36/V36C_COST_AWARE_ML_PROTOCOL.md'
      - '.github/workflows/v36c-cost-aware-ml.yml'
  workflow_dispatch:

concurrency:
  group: v36c-cost-aware-ml
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save dukascopy-node@1.50.0
      - shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .research-data/v36
          node scripts/v36_download_history.cjs eurusd m15 .research-data/v36/eurusd-m15.json 2005-01-01 2025-12-31 & p1=$!
          node scripts/v36_download_history.cjs gbpusd m15 .research-data/v36/gbpusd-m15.json 2005-01-01 2025-12-31 & p2=$!
          wait "$p1"; wait "$p2"
      - uses: actions/upload-artifact@v4
        with:
          name: v36c-data
          path: .research-data/v36/
          retention-days: 2

  ml:
    needs: data
    strategy:
      fail-fast: false
      matrix:
        include:
          - {sm: 1.5, rr: 0.5, tag: s150r050}
          - {sm: 1.5, rr: 0.75, tag: s150r075}
          - {sm: 1.5, rr: 1.0, tag: s150r100}
          - {sm: 1.5, rr: 1.25, tag: s150r125}
          - {sm: 2.0, rr: 0.5, tag: s200r050}
          - {sm: 2.0, rr: 0.75, tag: s200r075}
          - {sm: 2.0, rr: 1.0, tag: s200r100}
          - {sm: 2.0, rr: 1.25, tag: s200r125}
          - {sm: 2.5, rr: 0.5, tag: s250r050}
          - {sm: 2.5, rr: 0.75, tag: s250r075}
          - {sm: 2.5, rr: 1.0, tag: s250r100}
          - {sm: 2.5, rr: 1.25, tag: s250r125}
          - {sm: 3.0, rr: 0.5, tag: s300r050}
          - {sm: 3.0, rr: 0.75, tag: s300r075}
          - {sm: 3.0, rr: 1.0, tag: s300r100}
          - {sm: 3.0, rr: 1.25, tag: s300r125}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v36c-data
          path: .research-data/v36
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile scripts/v36_zero_base_quant.py scripts/v36_zero_base_quant_fast.py scripts/v36c_ml_one.py
      - run: python scripts/v36c_ml_one.py --data-dir .research-data/v36 --out research-output/prehold --sm ${{ matrix.sm }} --rr ${{ matrix.rr }}
      - uses: actions/upload-artifact@v4
        with:
          name: v36c-${{ matrix.tag }}
          path: research-output/prehold/
          retention-days: 7

  aggregate:
    needs: [data, ml]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v36c-data
          path: .research-data/v36
      - uses: actions/download-artifact@v4
        with:
          pattern: v36c-s*
          path: research-output/prehold
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m py_compile scripts/v36c_aggregate_holdout.py
      - run: python scripts/v36c_aggregate_holdout.py --data-dir .research-data/v36 --results-dir research-output/prehold --out research-output/final
      - uses: actions/upload-artifact@v4
        with:
          name: v36c-cost-aware-final
          path: research-output/final/
          retention-days: 30
