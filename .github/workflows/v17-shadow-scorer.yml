name: v18-shadow-observers

on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v17-shadow-scorer.yml'
      - 'scripts/v18_shadow_observer_scorer.py'
      - 'reports/v17/V17_TTM_LIVE_CALIBRATOR.json'
      - 'reports/v18/V18_STATE_TWIN_STUDENT.json'

permissions:
  contents: read
  id-token: write

concurrency:
  group: v18-shadow-observers
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Compile dual observer scorer
        run: python -m py_compile scripts/v18_shadow_observer_scorer.py
      - name: Install CPU-only observer runtime
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.10.0'
          pip install 'granite-tsfm==0.3.6' requests pandas numpy
      - name: Request short-lived GitHub OIDC token
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=v2-shadow-arena")"
          token="$(printf '%s' "$response" | python -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$token"
          echo "V2_OIDC=$token" >> "$GITHUB_ENV"
      - name: Score pending eligible Shadow Arena records
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          python scripts/v18_shadow_observer_scorer.py \
            --endpoint 'https://uykjgyqoptsvvkaifphm.supabase.co/functions/v1/shadow-score-gateway' \
            --ttm-calibrator reports/v17/V17_TTM_LIVE_CALIBRATOR.json \
            --student reports/v18/V18_STATE_TWIN_STUDENT.json
