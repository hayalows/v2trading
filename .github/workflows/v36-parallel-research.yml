name: v36-parallel-research

on:
  push:
    branches: [main]
    paths:
      - 'scripts/v36_rule_only.py'
      - 'scripts/v36_ml_one.py'
      - 'scripts/v36_aggregate_holdout.py'
      - '.github/workflows/v36-parallel-research.yml'
  workflow_dispatch:

concurrency:
  group: v36-parallel-research
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: npm install --no-save dukascopy-node@1.50.0
      - shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .research-data/v36
          node scripts/v36_download_history.cjs eurusd m15 .research-data/v36/eurusd-m15.json 2005-01-01 2025-12-31 & p1=$!
          node scripts/v36_download_history.cjs gbpusd m15 .research-data/v36/gbpusd-m15.json 2005-01-01 2025-12-31 & p2=$!
          wait "$p1"; wait "$p2"
      - uses: actions/upload-artifact@v4
        with:
          name: v36-par-data
          path: .research-data/v36/
          retention-days: 2

  rules:
    needs: data
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: v36-par-data, path: .research-data/v36}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m py_compile scripts/v36_zero_base_quant.py scripts/v36_zero_base_quant_fast.py scripts/v36_rule_only.py
      - run: python scripts/v36_rule_only.py --data-dir .research-data/v36 --out research-output/prehold
      - uses: actions/upload-artifact@v4
        with:
          name: v36-par-rules
          path: research-output/prehold/
          retention-days: 7

  ml:
    needs: data
    strategy:
      fail-fast: false
      matrix:
        include:
          - {sm: 0.75, rr: 0.75, tag: sm075_rr075}
          - {sm: 0.75, rr: 1.0, tag: sm075_rr100}
          - {sm: 0.75, rr: 1.25, tag: sm075_rr125}
          - {sm: 0.75, rr: 1.5, tag: sm075_rr150}
          - {sm: 1.0, rr: 0.75, tag: sm100_rr075}
          - {sm: 1.0, rr: 1.0, tag: sm100_rr100}
          - {sm: 1.0, rr: 1.25, tag: sm100_rr125}
          - {sm: 1.0, rr: 1.5, tag: sm100_rr150}
          - {sm: 1.25, rr: 0.75, tag: sm125_rr075}
          - {sm: 1.25, rr: 1.0, tag: sm125_rr100}
          - {sm: 1.25, rr: 1.25, tag: sm125_rr125}
          - {sm: 1.25, rr: 1.5, tag: sm125_rr150}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: v36-par-data, path: .research-data/v36}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m py_compile scripts/v36_zero_base_quant.py scripts/v36_zero_base_quant_fast.py scripts/v36_ml_one.py
      - run: python scripts/v36_ml_one.py --data-dir .research-data/v36 --out research-output/prehold --sm ${{ matrix.sm }} --rr ${{ matrix.rr }}
      - uses: actions/upload-artifact@v4
        with:
          name: v36-par-ml-${{ matrix.tag }}
          path: research-output/prehold/
          retention-days: 7

  aggregate:
    needs: [data, rules, ml]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: v36-par-data, path: .research-data/v36}
      - uses: actions/download-artifact@v4
        with: {name: v36-par-rules, path: research-output/prehold}
      - uses: actions/download-artifact@v4
        with:
          pattern: v36-par-ml-*
          path: research-output/prehold
          merge-multiple: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m py_compile scripts/v36_aggregate_holdout.py
      - run: python scripts/v36_aggregate_holdout.py --data-dir .research-data/v36 --results-dir research-output/prehold --out research-output/final
      - uses: actions/upload-artifact@v4
        with:
          name: v36-parallel-final
          path: research-output/final/
          retention-days: 30
