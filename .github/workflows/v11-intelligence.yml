name: v11-intelligence

on:
  pull_request:
    paths:
      - 'web/**'
      - 'supabase/functions/episode-engine/**'
      - 'supabase/functions/lab-insights/**'
      - 'supabase/migrations/**'
      - 'scripts/v11_validate_episode_logic.mjs'
      - 'scripts/v08_validate_frontend.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate episode semantics
        run: node scripts/v11_validate_episode_logic.mjs
      - name: Validate intelligence frontend
        run: node scripts/v08_validate_frontend.mjs
      - name: Check Edge Function syntax markers
        run: |
          grep -q 'formation_episodes' supabase/functions/episode-engine/index.ts
          grep -q 'episode_outcomes' supabase/functions/episode-engine/index.ts
          grep -q 'safeToInterpret' supabase/functions/lab-insights/index.ts
          grep -q 'v2-episode-engine-15m' supabase/migrations/20260808014500_v11_episode_intelligence.sql
