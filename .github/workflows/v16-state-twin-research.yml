name: v16-state-twin-research

on:
  pull_request:
    paths:
      - 'scripts/v16_state_twin_research.py'
      - 'scripts/v06_prospective_detector_validation_np.py'
      - 'scripts/public_data_v2_proxy.py'
      - 'reports/v16/V16_STATE_TWIN_PROTOCOL.md'
      - '.github/workflows/v16-state-twin-research.yml'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  walk-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install research dependencies
        run: pip install -r requirements.txt
      - name: Download frozen EURUSD and GBPUSD M15 history
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .research-data/market
          base='https://huggingface.co/datasets/NatoG93/market-data/resolve/main'
          for symbol in EURUSD GBPUSD; do
            curl -L --fail --retry 4 --retry-delay 2 \
              -o ".research-data/market/${symbol}-15m.feather" \
              "${base}/${symbol}-15m.feather?download=true"
          done
          ls -lh .research-data/market
      - name: Run preregistered StateTwin landmark walk-forward
        run: |
          PYTHONPATH=scripts python scripts/v16_state_twin_research.py \
            --data-dir .research-data/market \
            --start 2020-01-01 \
            --out research-output/v16
      - name: Show frozen decision
        run: |
          cat research-output/v16/v16_state_twin_summary.json
      - name: Upload StateTwin research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v16-state-twin-research
          path: research-output/v16/
          retention-days: 14
